<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEEF_SURCHI - Roblox Script Asset ID</title>
    
    <!-- PWA / Add to Home Screen Meta & Icon Integration -->
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ROBLOX VIP">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; position: relative; }
        
        /* Main Container */
        #main-content { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .site-logo { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        header h1 { font-size: 22px; color: #f8fafc; margin-bottom: 2px; }
        header a { color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: bold; }

        /* Upload Box */
        .upload-section { background: #111827; border: 2px dashed #334155; padding: 30px; border-radius: 14px; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-section:hover { border-color: #38bdf8; background: #1e293b; }
        .upload-section input { display: none; }
        .upload-label { font-size: 16px; font-weight: bold; color: #38bdf8; cursor: pointer; }
        .rules-text { font-size: 13px; color: #94a3b8; margin-top: 12px; line-height: 1.5; }

        /* ID Result Box */
        .result-box { background: #111827; border: 1px solid #334155; padding: 25px; border-radius: 14px; text-align: center; display: none; flex-direction: column; gap: 15px; }
        .id-text { font-family: monospace; font-size: 18px; color: #38bdf8; font-weight: bold; word-break: break-all; }
        .copy-btn { background: #38bdf8; color: #090d16; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .copy-btn:hover { background: #0ea5e9; }
        .back-btn { background: #334155; color: #f8fafc; border: none; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .back-btn:hover { background: #475569; }
    </style>
</head>
<body>

    <!-- Main Content -->
    <div id="main-content">
        <header>
            <img src="logo.png" alt="YUSEEF_SURCHI logo" class="site-logo">
            <div>
                <h1>Roblox Script Asset Hub</h1>
                <a href="https://t.me/LEGEND_MODS33" target="_blank">made by LEGEND_MODS33</a>
            </div>
        </header>

        <!-- Upload Section -->
        <div class="upload-section" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <div class="upload-label">📁 Upload Image or Video (Min 10 Min)</div>
            <input type="file" id="file-input" accept="image/*,video/*" onchange="handleFileSelect(event)">
            <div class="rules-text">
                🎮 <b>For Roblox Scripts & Assets</b>.<br>
                ⏱️ Video requirement: Must be <b>10 minutes or longer</b>.<br>
                🛡️ <b>MAFE CHAPE PARASTIA LEGEND_MODS33</b>.<br>
                📱 <i>Tip: Add to Home Screen to use with app icon (logo.png)</i>
            </div>
        </div>

        <!-- Result Box (Only Asset ID) -->
        <div class="result-box" id="result-box">
            <div class="id-text" id="generated-id">--</div>
            <button class="copy-btn" onclick="copyAssetId()">📋 Copy Asset ID</button>
            <button class="back-btn" onclick="goBackToUpload()">⬅ Upload Another</button>
        </div>
    </div>

    <script>
        let activeAssetId = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type.startsWith('video/')) {
                const videoElement = document.createElement('video');
                videoElement.src = URL.createObjectURL(file);
                
                videoElement.onloadedmetadata = function() {
                    window.URL.revokeObjectURL(videoElement.src);
                    if (videoElement.duration < 600) {
                        alert("⚠️ Error: Video must be 10 minutes or longer!");
                        document.getElementById('file-input').value = '';
                        return;
                    }
                    generateAssetId();
                };
            } else if (file.type.startsWith('image/')) {
                generateAssetId();
            } else {
                alert("Please select a valid image or video file.");
                document.getElementById('file-input').value = '';
            }
        }

        function generateAssetId() {
            const randomCode = Math.floor(10000000 + Math.random() * 90000000);
            activeAssetId = randomCode.toString();
            
            document.getElementById('generated-id').innerText = activeAssetId;
            document.getElementById('drop-zone').style.display = 'none';
            document.getElementById('result-box').style.display = 'flex';
        }

        function copyAssetId() {
            if (!activeAssetId) return;
            navigator.clipboard.writeText(activeAssetId).then(() => {
                alert("Asset ID Copied successfully: " + activeAssetId);
            });
        }

        function goBackToUpload() {
            document.getElementById('file-input').value = '';
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('drop-zone').style.display = 'block';
            activeAssetId = "";
        }
    </script>
</body>
</html>
